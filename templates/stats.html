{% extends "base.html" %}
{% load static %}
{% block title %}Statistik{% endblock %}
{% block content %}
<h1 class="mb-4 text-2xl font-semibold text-slate-900">Statistik</h1>

<div class="grid grid-cols-1 gap-6 lg:grid-cols-2">
  {% for c in charts %}
  <section class="rounded-lg border border-slate-200 bg-white p-6 shadow-sm">
    <h2 class="mb-3 text-lg font-semibold text-slate-900">{{ c.title }}</h2>
    <canvas data-metric="{{ c.metric }}" width="600" height="300" role="img" aria-label="{{ c.title }}" class="w-full"></canvas>
    <noscript>
      <p class="mt-2 text-sm text-slate-500">JavaScript ist deaktiviert — die Daten stehen unten als Tabelle zur Verfügung.</p>
    </noscript>
    <details class="mt-3">
      <summary class="cursor-pointer text-sm font-medium text-slate-600 hover:text-slate-900">Daten als Tabelle</summary>
      <div class="mt-2 overflow-x-auto">
        <table class="min-w-full divide-y divide-slate-200 text-sm">
          <thead class="bg-slate-50">
            <tr><th class="px-3 py-1.5 text-left font-medium text-slate-600">Kategorie</th><th class="px-3 py-1.5 text-left font-medium text-slate-600">Anzahl</th></tr>
          </thead>
          <tbody class="divide-y divide-slate-100">
            {% for r in c.rows %}<tr><td class="px-3 py-1.5">{{ r.label }}</td><td class="px-3 py-1.5">{{ r.value }}</td></tr>{% endfor %}
          </tbody>
        </table>
      </div>
    </details>
  </section>
  {% endfor %}
</div>

<script src="{% static 'vendor/chart.min.js' %}"></script>
<script src="{% static 'js/dashboards.js' %}"></script>
{% endblock %}
