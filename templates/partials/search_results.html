<ul class="divide-y divide-slate-200 rounded-md border border-slate-200 bg-white">
  {% for hit in hits %}
    <li class="px-4 py-2 text-sm hover:bg-slate-50">
      <a href="/gebaeude/{{ hit.egid }}/" class="font-medium text-slate-900 hover:underline">{{ hit.label }}</a>
      <small title="EGID" class="ml-2 text-slate-500">EGID {{ hit.egid }}</small>
    </li>
  {% empty %}
    <li class="px-4 py-2 text-sm text-slate-500">Keine Treffer.</li>
  {% endfor %}
</ul>
