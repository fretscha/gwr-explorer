<!doctype html>
{% load static %}
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}GWR Explorer{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/app.css' %}" />
    <script src="{% static 'vendor/htmx.min.js' %}" defer></script>
    <script src="{% static 'vendor/alpine.min.js' %}" defer></script>
  </head>
  <body class="min-h-screen bg-slate-50 text-slate-900">
    <nav class="border-b border-slate-200 bg-white shadow-sm">
      <div class="mx-auto flex max-w-6xl flex-wrap items-center justify-between gap-2 px-4 py-3 sm:px-6">
        <a href="/" class="text-lg font-semibold tracking-tight text-slate-900">GWR Explorer</a>
        <div class="flex flex-wrap gap-1">
          <a href="/" class="rounded-md px-3 py-2 text-sm font-medium text-slate-600 hover:bg-slate-100 hover:text-slate-900">Suche</a>
          <a href="/statistik/" class="rounded-md px-3 py-2 text-sm font-medium text-slate-600 hover:bg-slate-100 hover:text-slate-900">Statistik</a>
          <a href="/karte/" class="rounded-md px-3 py-2 text-sm font-medium text-slate-600 hover:bg-slate-100 hover:text-slate-900">Karte</a>
          <a href="/explorer/" class="rounded-md px-3 py-2 text-sm font-medium text-slate-600 hover:bg-slate-100 hover:text-slate-900">Explorer</a>
        </div>
      </div>
    </nav>
    <main class="mx-auto max-w-6xl px-4 py-6 sm:px-6">
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
