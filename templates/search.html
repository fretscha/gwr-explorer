{% extends "base.html" %}
{% block content %}
<div class="mx-auto max-w-2xl">
  <div class="rounded-lg border border-slate-200 bg-white p-6 shadow-sm">
    <h1 class="mb-4 text-2xl font-semibold text-slate-900">GWR-Suche</h1>
    <input type="search" name="q" placeholder="Adresse, Gemeinde oder EGID"
           class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm shadow-sm
                  focus:border-slate-500 focus:outline-none focus:ring-1 focus:ring-slate-500"
           hx-get="/suche/" hx-target="#results" hx-trigger="keyup changed delay:300ms" />
    <div id="results" class="mt-4"></div>
  </div>
</div>
{% endblock %}
