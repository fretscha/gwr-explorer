[project]
name = "gwr"
version = "0.1.0"
description = "GWR Explorer - Swiss GWR building & dwelling register search/map/analysis tool"
requires-python = ">=3.12"
dependencies = [
    "django>=5.0,<6.0",
    "pyproj>=3.8.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "ruff>=0.16.6",
    "ty>=0.0.79",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "E501"]

[tool.ruff.lint.per-file-ignores]
# Django-generated migration files use mutable class-attribute defaults
# (dependencies/operations lists) by design; not worth hand-editing generated code.
"*/migrations/*.py" = ["RUF012"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
testpaths = ["tests"]
addopts = "--no-migrations"
