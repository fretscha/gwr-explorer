name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Lint & test
    runs-on: ubuntu-latest
    services:
      db:
        image: postgis/postgis:17-3.4
        env:
          POSTGRES_USER: gwr
          POSTGRES_PASSWORD: gwr
          POSTGRES_DB: gwr
        ports:
          - 5432:5432
        # POSTGRES_USER is a superuser in this image, so the migrations'
        # CREATE EXTENSION postgis / pg_trgm succeed and pytest can create the
        # test_gwr database.
        options: >-
          --health-cmd "pg_isready -U gwr"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: gwr
      PGPASSWORD: gwr
      PGDATABASE: gwr
    steps:
      - uses: actions/checkout@v4

      - name: Install GeoDjango native libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils libproj-dev gdal-bin libgdal-dev libgeos-dev

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff
        run: uv run ruff check src tests config

      - name: Tests
        run: uv run pytest -q

  docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          tags: gwr-explorer:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
