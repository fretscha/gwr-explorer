services:
  db:
    image: postgis/postgis:17-3.4
    environment:
      POSTGRES_USER: gwr
      POSTGRES_PASSWORD: gwr
      POSTGRES_DB: gwr
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGUSER: gwr
      PGPASSWORD: gwr
      PGDATABASE: gwr
      DJANGO_DEBUG: "1"
    depends_on:
      - db
    ports:
      - "8000:8000"

volumes:
  pgdata:
